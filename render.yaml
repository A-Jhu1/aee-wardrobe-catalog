services:
  - type: web
    name: aee-wardrobe-catalog
    runtime: static
    autoDeployTrigger: off
    buildCommand: echo "Static catalog ready"
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
